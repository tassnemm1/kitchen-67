[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# React Router owns the addresses, not the file system. Without this rule a
# reload on /menu asks Netlify for a file that was never built, and the guest
# gets a 404 instead of the menu.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
